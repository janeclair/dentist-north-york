<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Dentist North York — Canada Weather & Local Time</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main class="container">
    <header>
      <h1>Dentist North York</h1>
      <p class="tag">Local Canada weather & time</p>
    </header>

    <section class="controls">
      <label for="citySelect">Choose a city</label>
      <select id="citySelect">
        <option value="Toronto">Toronto</option>
        <option value="Montreal">Montreal</option>
        <option value="Vancouver">Vancouver</option>
        <option value="Ottawa">Ottawa</option>
        <option value="Calgary">Calgary</option>
        <option value="Edmonton">Edmonton</option>
      </select>
      <button id="locBtn">Use my location</button>
      <button id="refreshBtn">Refresh</button>
    </section>

    <section id="result" class="result">
      <div class="place" id="place">—</div>
      <div class="time" id="time">--:--:--</div>
      <div class="weather">
        <img id="icon" alt="weather icon" />
        <div class="details">
          <div id="temp">— °C</div>
          <div id="desc">—</div>
          <div id="extras">Wind: — | Humidity: —</div>
        </div>
      </div>
      <div id="status" class="status"></div>
    </section>

    <footer>
      <small>Data from Open‑Meteo (no API key required). Time shown using browser Intl with IANA timezones.</small>
    </footer>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
